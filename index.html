<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Аудиокниги с синхронным текстом</title>
<style>
  body {
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 720px;

    padding: 40px 24px;

    color: #222;
  }
  h1 { font-weight: normal; font-size: 28px; margin-bottom: 4px; }
  .subtitle { font-family: sans-serif; font-size: 14px; color: #888; margin-bottom: 32px; }

  .book-card {
    display: block;
    padding: 20px 24px;

    color: inherit;

  .book-card:hover { border-color: #d0a94a; transform: translateY(-1px); }

  <a class="book-card" href="bryusov-poslednie-stranitsy/reader.html">
    <div class="book-title">Валерий Брюсов — «Последние страницы из дневника женщины»</div>
