<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<title>Аудиокниги с синхронным текстом</title>
<style>
  :root {
    --bg: #fdfcf9;
    --ink: #222;
    --muted: #888;
    --line: #e2ddd2;
    --gold: #d0a94a;
    --hh: 70px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
  }
  body.tl { overflow: hidden; height: 100vh; }

  /* ---------- шапка ---------- */
  header { padding: 14px 20px 10px; }
  .head-row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  h1 { font-weight: normal; font-size: 22px; margin: 0; }
  .subtitle { font-family: sans-serif; font-size: 13px; color: var(--muted); width: 100%; }
  body.tl .subtitle { display: none; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1;
    font-family: sans-serif; font-size: 13px;
  }
  .toolbar button {
    font: inherit; padding: 6px 11px; min-width: 34px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 8px; cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--gold); }
  .toolbar button.active { background: #f6eed7; border-color: var(--gold); }
  .toolbar .spacer { flex: 1; }
  .toolbar .hint { color: var(--muted); font-size: 12px; }
  @media (max-width: 1450px) { .toolbar .hint { display: none; } }

  /* ---------- линия времени: без рамки, на весь экран ---------- */
  #viewport {
    position: fixed; left: 0; right: 0; bottom: 0; top: var(--hh);
    overflow: auto;
    touch-action: pan-x pan-y;
    cursor: grab;
    -webkit-overflow-scrolling: touch;
  }
  #viewport.dragging { cursor: grabbing; user-select: none; }
  #track { position: relative; }

  .ruler { position: sticky; z-index: 6; background: var(--bg); }
  .ruler-line { position: absolute; background: #b9ae92; }
  .grid { position: absolute; background: #f1ede2; }
  .grid.minor { background: #f8f6ef; }
  .tick-mark { position: absolute; background: #b9ae92; }
  .tick-label {
    position: absolute; transform: translateX(-50%);
    font-family: sans-serif; font-size: 12px; color: #8a7f60; white-space: nowrap;
    pointer-events: none;
  }
  .tick-label.minor { font-size: 10px; color: #b3aa90; }
  .v .tick-label { transform: translateY(-50%); }

  .future {
    position: absolute;
    background: repeating-linear-gradient(135deg, rgba(120,100,60,.06) 0 6px, transparent 6px 14px);
  }
  .today-line { position: absolute; background: #c0583a; opacity: .55; }
  .today-label {
    position: absolute; font-family: sans-serif; font-size: 11px; line-height: 18px;
    color: #b0583a; white-space: nowrap; pointer-events: none;
    background: var(--bg); border: 1px solid #e3b9a8; border-radius: 9px; padding: 0 8px;
    z-index: 2;
  }
  .v .today-label { writing-mode: vertical-rl; padding: 8px 0; line-height: 18px; }
  .today-label.left { transform: translateX(-100%); }
  .v .today-label.left { transform: translateY(-100%); }

  .life {
    position: absolute; border-radius: 6px;
    background: color-mix(in srgb, var(--c) 45%, #fff);
    border: 1px solid color-mix(in srgb, var(--c) 80%, #fff);
    z-index: 2;
  }
  .life.ongoing { border-right-style: dashed; }
  .life-wrap { position: absolute; z-index: 2; pointer-events: none; }
  .life-label {
    position: sticky; left: 4px; display: inline-block;
    font-family: sans-serif; font-size: 12px; line-height: 20px; color: #3b3320; white-space: nowrap;
  }
  .v .life-label { left: auto; top: 4px; writing-mode: vertical-rl; line-height: 20px; }

  .stem { position: absolute; background: var(--c); opacity: .55; }
  .dot {
    position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: var(--c); border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--c);
    z-index: 3;
  }
  .dot.small { cursor: pointer; }
  .dot.small:hover { transform: scale(1.35); }

  .t-card {
    position: absolute; z-index: 2;
    display: flex; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px; background: #fff;
    text-decoration: none; color: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    transition: box-shadow .15s;
    overflow: hidden;
  }
  a.t-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.14); z-index: 4; }
  .t-card .book-cover { width: 50px; height: 72px; flex-shrink: 0; }
  .t-card .book-info { min-width: 0; }
  .t-card .book-title {
    font-size: 14px; line-height: 1.25; margin: 0 0 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .t-card .book-author { font-size: 12px; margin-bottom: 3px; }
  .t-card .book-meta { font-size: 11px; }
  .t-date { color: #a07d1c; font-weight: bold; }
  .soon { border-style: dashed; border-left-style: solid; background: #fbfaf6; }
  .soon .book-cover { opacity: .6; }
  .book-cover.placeholder.empty { color: #bdb393; font-size: 11px; }
  .soon .book-title, .soon .book-author { color: #777; }
  .soon-tag { color: #aaa; }

  /* ---------- список ---------- */
  #listWrap { max-width: 780px; margin: 0 auto; padding: 8px 24px 48px; }
  .book-list { display: flex; flex-direction: column; gap: 16px; }
  .book-card {
    display: flex; gap: 20px; padding: 20px 24px;
    border: 1px solid var(--line); border-radius: 10px;
    text-decoration: none; color: inherit; background: #fff;
    transition: border-color .15s, transform .15s;
  }
  a.book-card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .book-card.soon { border-style: dashed; }
  .book-cover {
    width: 84px; height: 120px; flex-shrink: 0; object-fit: cover;
    border-radius: 4px; background: #eee5d0; box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .book-cover.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-family: sans-serif; font-size: 10px; color: #a99a6f; text-align: center; padding: 4px;
    overflow: hidden;
  }
  .book-info { display: flex; flex-direction: column; justify-content: center; }
  .book-title { font-size: 19px; margin: 0 0 4px; line-height: 1.3; }
  .book-author { font-family: sans-serif; font-size: 14px; color: #555; margin-bottom: 6px; }
  .book-meta { font-family: sans-serif; font-size: 12px; color: #999; }
  .hidden { display: none !important; }
</style>
</head>
<body class="tl">

<header id="header">
  <div class="head-row">
    <h1>Аудиокниги с синхронным текстом</h1>
    <div class="toolbar">
      <button id="zoomOut" title="Отдалить">−</button>
      <button id="zoomIn" title="Приблизить">+</button>
      <button id="fitAll">Показать все</button>
      <span class="hint" id="hint">колесо / щипок — масштаб · перетаскивание — сдвиг</span>
      <span class="spacer"></span>
      <button id="orientH" class="active">↔ Горизонтально</button>
      <button id="orientV">↕ Вертикально</button>
      <button id="viewTimeline" class="active">Линия времени</button>
      <button id="viewList">Список</button>
    </div>
    <div class="subtitle">Тексты общественного достояния — читать и слушать одновременно</div>
  </div>
</header>

<div id="viewport"><div id="track"></div></div>

<div id="listWrap" class="hidden"><div class="book-list" id="bookList"></div></div>

<script>
// ===============================================================
// ДАННЫЕ
// ---------------------------------------------------------------
// Авторы: born/died — "1899", "1899-04" или "1899-04-22".
// Без died автор считается живущим (полоса жизни идёт до сегодняшнего дня).
// ===============================================================
const authors = {
  bryusov: { name: "Валерий Брюсов",   born: "1873-12-13", died: "1924-10-09" },
  nabokov: { name: "Владимир Набоков", born: "1899-04-22", died: "1977-07-02" },
};

// Книги: author — ключ из authors; date — год первой публикации
// ("1910" | "1910-05" | "1910-05-17"). Без link — серая плашка «ещё не озвучена».
// cover необязателен: если файла обложки нет, покажется заглушка.
const books = [
  { title: "«Последние страницы из дневника женщины»", author: "bryusov", date: "1910",
    narrator: "Екатерина Егорова", partsCount: 5,
    cover: "bryusov-poslednie-stranitsy/cover.jpg", link: "bryusov-poslednie-stranitsy/reader.html" },

  { title: "«Машенька»", author: "nabokov", date: "1926",
    narrator: "Сергей Чонишвили", partsCount: 17,
    cover: "nabokov-mashenka/cover.jpg", link: "nabokov-mashenka/reader.html" },

  // --- Набоков: остальные произведения (пока без озвучки) ---
  { title: "«Стихи»",                              author: "nabokov", date: "1916" },
  { title: "«Гроздь»",                             author: "nabokov", date: "1922" },
  { title: "«Горний путь»",                        author: "nabokov", date: "1923" },
  { title: "«Король, дама, валет»",                author: "nabokov", date: "1928" },
  { title: "«Защита Лужина»",                      author: "nabokov", date: "1930" },
  { title: "«Соглядатай»",                         author: "nabokov", date: "1930" },
  { title: "«Подвиг»",                             author: "nabokov", date: "1932" },
  { title: "«Камера обскура»",                     author: "nabokov", date: "1933" },
  { title: "«Отчаяние»",                           author: "nabokov", date: "1936" },
  { title: "«Приглашение на казнь»",               author: "nabokov", date: "1938" },
  { title: "«Дар»",                                author: "nabokov", date: "1938" },
  { title: "«Истинная жизнь Себастьяна Найта»",    author: "nabokov", date: "1941" },
  { title: "«Николай Гоголь»",                     author: "nabokov", date: "1944" },
  { title: "«Под знаком незаконнорождённых»",      author: "nabokov", date: "1947" },
  { title: "«Память, говори»",                     author: "nabokov", date: "1951" },
  { title: "«Другие берега»",                      author: "nabokov", date: "1954" },
  { title: "«Лолита»",                             author: "nabokov", date: "1955" },
  { title: "«Пнин»",                               author: "nabokov", date: "1957" },
  { title: "«Бледное пламя»",                      author: "nabokov", date: "1962" },
  { title: "«Ада, или Радости страсти»",           author: "nabokov", date: "1969" },
  { title: "«Прозрачные вещи»",                    author: "nabokov", date: "1972" },
  { title: "«Смотри на арлекинов!»",               author: "nabokov", date: "1974" },
  { title: "«Подлинник Лауры»",                    author: "nabokov", date: "2009" },
];

const PALETTE = ['#d0a94a', '#5f93b0', '#a26a98', '#6fa56a', '#c4724f'];

// ===============================================================
// ДАТЫ
// ===============================================================
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const yearFrac = (mo, d) => (Date.UTC(2001, mo - 1, d || 1) - Date.UTC(2001, 0, 1)) / (365 * 864e5);

function parseDate(s) {
  if (!s) return null;
  const m = String(s).match(/^(-?\d{1,4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/);
  if (!m) return null;
  const y = +m[1], mo = m[2] ? +m[2] : null, d = m[3] ? +m[3] : null;
  let label = `${y}`;
  if (mo && d) label = `${d} ${MONTHS_GEN[mo - 1]} ${y}`;
  else if (mo) label = `${MONTHS_GEN[mo - 1]} ${y}`;
  return { year: y, value: y + (mo ? yearFrac(mo, d) : 0), label };
}
const NOW = new Date();
const TODAY = NOW.getFullYear() + yearFrac(NOW.getMonth() + 1, NOW.getDate());
const TODAY_LABEL = `${NOW.getDate()} ${MONTHS_GEN[NOW.getMonth()]} ${NOW.getFullYear()}`;

function partsLabel(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return 'часть';
  if ([2, 3, 4].includes(a) && ![12, 13, 14].includes(b)) return 'части';
  return 'частей';
}

// ===============================================================
// ПОДГОТОВКА ДАННЫХ
// ===============================================================
let groups = [];   // [{key, author, color, born, died, books[]}]
function prepare() {
  books.forEach(b => { b._d = parseDate(b.date); });
  const map = new Map();
  books.filter(b => b._d).forEach(b => {
    const k = b.author || '';
    if (!map.has(k)) {
      const a = authors[k] || null;
      map.set(k, { key: k, author: a, born: a && parseDate(a.born), died: a && a.died ? parseDate(a.died) : null, books: [] });
    }
    map.get(k).books.push(b);
  });
  groups = [...map.values()];
  groups.forEach(g => g.books.sort((a, b) => a._d.value - b._d.value));
  groups.sort((a, b) => (a.born ? a.born.value : a.books[0]._d.value) - (b.born ? b.born.value : b.books[0]._d.value));
  groups.forEach((g, i) => { g.color = PALETTE[i % PALETTE.length]; });
}
const authorName = b => (authors[b.author] ? authors[b.author].name : '');

// ===============================================================
// КАРТОЧКИ (общие куски)
// ===============================================================
function makeCover(book) {
  if (!book.cover) {
    const d = document.createElement('div');
    d.className = 'book-cover placeholder empty';
    d.textContent = book.link ? '' : 'скоро';
    return d;
  }
  const img = document.createElement('img');
  img.className = 'book-cover';
  img.src = book.cover || '';
  img.alt = book.title;
  img.onerror = () => {
    img.onerror = null;
    img.removeAttribute('src');
    img.alt = '';
    img.classList.add('placeholder');
    const span = document.createElement('span');
    span.textContent = book.title;
    img.appendChild(span);
  };
  return img;
}
function metaText(book, withDate) {
  const p = [];
  if (!book.link) p.push('ещё не озвучена');
  if (book.partsCount) p.push(`${book.partsCount} ${partsLabel(book.partsCount)}`);
  if (book.narrator) p.push(`читает ${book.narrator}`);
  if (withDate && book._d) p.push(book._d.label);
  return p.join(' · ');
}
function listCard(book) {
  const a = document.createElement(book.link ? 'a' : 'div');
  a.className = 'book-card' + (book.link ? '' : ' soon');
  if (book.link) a.href = book.link;
  const info = document.createElement('div');
  info.className = 'book-info';
  info.innerHTML = '<div class="book-title"></div><div class="book-author"></div><div class="book-meta"></div>';
  info.children[0].textContent = book.title;
  info.children[1].textContent = authorName(book);
  info.children[2].textContent = metaText(book, true);
  a.append(makeCover(book), info);
  return a;
}

// ===============================================================
// ЛИНИЯ ВРЕМЕНИ
// ===============================================================
const CARD_W = 250, CARD_H = 88, GAP = 10, LANE_GAP = 10;
const MIN_SCALE = 0.1, MAX_SCALE = 2000;   // пикселей на год

const viewport = document.getElementById('viewport');
const track = document.getElementById('track');
let scale = 40;
let baseMin = 1900, baseMax = 2030, viewMin = 1900, viewMax = 2030;
let orient = 'h';
const isH = () => orient === 'h';
const LEN = () => isH() ? CARD_W : CARD_H;       // размер карточки вдоль оси времени
const CROSS = () => isH() ? CARD_H : CARD_W;     // поперёк оси
const PAD = () => LEN() / 2 + 24;
const clientMain = () => isH() ? viewport.clientWidth : viewport.clientHeight;
const clientCross = () => isH() ? viewport.clientHeight : viewport.clientWidth;
const scrollMain = () => isH() ? viewport.scrollLeft : viewport.scrollTop;
const setScrollMain = v => { if (isH()) viewport.scrollLeft = v; else viewport.scrollTop = v; };
const ptrMain = e => isH() ? e.clientX : e.clientY;
const rectMain = () => { const r = viewport.getBoundingClientRect(); return isH() ? r.left : r.top; };

function computeRange() {
  let vals = [TODAY];
  groups.forEach(g => {
    g.books.forEach(b => vals.push(b._d.value));
    if (g.born) vals.push(g.born.value);
    if (g.died) vals.push(g.died.value);
  });
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const margin = Math.max(3, (hi - lo) * 0.07);
  baseMin = Math.floor(lo - margin);
  baseMax = Math.ceil(hi + margin);     // всегда есть запас в будущее за «сегодня»
}
// если окно шире данных — продолжаем линию: в прошлое и, главное, в будущее
function ensureRange() {
  viewMin = baseMin; viewMax = baseMax;
  const extra = (clientMain() - 2 * PAD()) / scale - (viewMax - viewMin);
  if (extra > 0) { viewMin -= extra * 0.25; viewMax += extra * 0.75; }
}
const posOf = v => PAD() + (v - viewMin) * scale;

function niceStep() {
  const min = isH() ? 80 : 46;
  for (const s of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000, 2000, 5000]) if (s * scale >= min) return s;
  return 10000;
}

// положить элемент: m — позиция вдоль оси времени, c — поперёк; ms/cs — размеры
function put(cls, parent, m, c, ms, cs, text) {
  const e = document.createElement('div');
  e.className = cls;
  placeEl(e, m, c, ms, cs);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
}
function placeEl(e, m, c, ms, cs) {
  const s = e.style;
  if (isH()) {
    s.left = m + 'px'; s.top = c + 'px';
    if (ms != null) s.width = ms + 'px';
    if (cs != null) s.height = cs + 'px';
  } else {
    s.top = m + 'px'; s.left = c + 'px';
    if (ms != null) s.height = ms + 'px';
    if (cs != null) s.width = cs + 'px';
  }
}

function renderTimeline() {
  track.innerHTML = '';
  track.classList.toggle('v', !isH());
  ensureRange();
  const total = Math.ceil(PAD() * 2 + (viewMax - viewMin) * scale);
  const RULER = isH() ? 36 : 70;
  const LBL = 20, BARH = 12, HEAD = LBL + BARH, STEM = 14, GROUP_GAP = 26;
  const laneH = CROSS() + LANE_GAP;
  const maxLanes = isH() ? 3 : 2;

  // ---- раскладка групп (автор = «дорожка») ----
  let c0 = RULER + 16;
  const layouts = groups.map(g => {
    const lastEnd = [], items = [];
    g.books.forEach(b => {
      const p = posOf(b._d.value);
      const start = Math.max(6, Math.min(p - LEN() / 2, total - LEN() - 6));
      let lane = 0;
      while (lane < lastEnd.length && lastEnd[lane] + GAP > start) lane++;
      if (lane < maxLanes) { lastEnd[lane] = start + LEN(); items.push({ b, p, start, lane }); }
      else items.push({ b, p, start, lane: -1 });          // не влезла — только точка
    });
    const lanes = Math.min(maxLanes, lastEnd.length);
    const L = { g, items, c0, lanes };
    c0 += HEAD + (lanes ? STEM + lanes * laneH : 0) + GROUP_GAP;
    return L;
  });
  const crossTotal = Math.max(c0, clientCross());

  if (isH()) { track.style.width = total + 'px'; track.style.height = crossTotal + 'px'; }
  else { track.style.width = crossTotal + 'px'; track.style.height = total + 'px'; }

  // ---- линейка (липкая) ----
  const ruler = put('ruler', track, 0, 0, total, RULER);
  const step = niceStep();
  const from = Math.ceil(viewMin / step) * step;
  for (let y = from; y <= viewMax; y += step) {
    const p = posOf(y);
    put('grid', track, p, 0, 1, crossTotal);
    put('tick-mark', ruler, p, RULER - 9, 1, 8);
    put('tick-label', ruler, p, 8, null, null, String(y));
  }
  if (scale >= 160) {
    const labels = scale >= 480;
    for (let y = Math.floor(viewMin); y <= viewMax; y++) {
      for (let m = 2; m <= 12; m++) {
        const v = y + yearFrac(m, 1);
        if (v < viewMin || v > viewMax) continue;
        const p = posOf(v);
        put('grid minor', track, p, 0, 1, crossTotal);
        put('tick-mark', ruler, p, RULER - 6, 1, 5);
        if (labels) put('tick-label minor', ruler, p, 8, null, null, MONTHS_SHORT[m - 1]);
      }
    }
  }
  put('ruler-line', ruler, 0, RULER - 2, total, 2);

  // ---- «сегодня» и будущее ----
  const tp = posOf(TODAY);
  put('future', track, tp, 0, Math.max(0, total - tp), crossTotal);
  put('today-line', track, tp, 0, 2, crossTotal);
  put('today-label left', ruler, tp - 8, isH() ? 8 : 6, null, null, 'сегодня · ' + TODAY_LABEL);
  put('today-label', ruler, tp + 8, isH() ? 8 : 6, null, null, 'будущее →');

  // ---- группы ----
  layouts.forEach(({ g, items, c0, lanes }) => {
    const col = g.color;
    const holder = document.createElement('div');
    holder.style.setProperty('--c', col);

    // полоса жизни автора
    let s0, s1, label, title;
    if (g.born) {
      s0 = posOf(g.born.value);
      s1 = posOf(g.died ? g.died.value : TODAY);
      const by = g.born.year, dy = g.died ? g.died.year : '';
      label = `${g.author.name} · ${by}–${dy}`;
      title = `${g.author.name}: ${g.born.label} — ${g.died ? g.died.label : 'наши дни'}`;
    } else {
      s0 = items[0].p; s1 = items[items.length - 1].p;
      label = g.author ? g.author.name : '';
      title = label;
    }
    const len = Math.max(6, s1 - s0);
    const life = put('life' + (g.died || !g.born ? '' : ' ongoing'), holder, s0, c0 + LBL, len, BARH);
    life.style.setProperty('--c', col);
    life.title = title;
    if (label) {
      const wrap = put('life-wrap', holder, s0, c0, len, LBL);
      const lb = document.createElement('span');
      lb.className = 'life-label';
      lb.textContent = label;
      wrap.appendChild(lb);
    }

    items.forEach(({ b, p, start, lane }) => {
      const dot = put('dot' + (lane < 0 ? ' small' : ''), holder, p, c0 + LBL + BARH / 2);
      dot.style.setProperty('--c', col);
      dot.title = `${b.title} — ${b._d.label}`;
      if (lane < 0) {
        dot.onclick = e => { e.stopPropagation(); setScale(scale * 3, p - scrollMain()); };
        return;
      }
      const cardC = c0 + HEAD + STEM + lane * laneH;
      const stem = put('stem', holder, p, c0 + HEAD, 1, STEM + lane * laneH);
      stem.style.setProperty('--c', col);

      const a = document.createElement(b.link ? 'a' : 'div');
      a.className = 't-card' + (b.link ? '' : ' soon');
      a.style.setProperty('--c', col);
      if (b.link) a.href = b.link;
      placeEl(a, start, cardC, null, null);
      a.style.width = CARD_W + 'px'; a.style.height = CARD_H + 'px';
      const info = document.createElement('div');
      info.className = 'book-info';
      info.innerHTML = '<div class="book-title"></div><div class="book-author"></div><div class="book-meta"></div>';
      info.children[0].textContent = b.title;
      info.children[1].textContent = authorName(b);
      info.children[2].innerHTML = '<span class="t-date"></span><span class="soon-tag"></span>';
      info.children[2].children[0].textContent = b._d.label;
      if (!b.link) info.children[2].children[1].textContent = ' · ещё не озвучена';
      a.append(makeCover(b), info);
      holder.appendChild(a);
    });
    while (holder.firstChild) track.appendChild(holder.firstChild);
  });
}

// ---------- масштаб ----------
function setScale(newScale, anchorPx) {
  newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
  if (newScale === scale) return;
  if (anchorPx == null) anchorPx = clientMain() / 2;
  const yearAtAnchor = viewMin + (scrollMain() + anchorPx - PAD()) / scale;
  scale = newScale;
  renderTimeline();
  setScrollMain(PAD() + (yearAtAnchor - viewMin) * scale - anchorPx);
}
function fitAll() {
  computeRange();
  viewMin = baseMin; viewMax = baseMax;
  scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, (clientMain() - PAD() * 2) / (baseMax - baseMin)));
  renderTimeline();
  viewport.scrollLeft = 0; viewport.scrollTop = 0;
}

document.getElementById('zoomIn').onclick = () => setScale(scale * 1.6);
document.getElementById('zoomOut').onclick = () => setScale(scale / 1.6);
document.getElementById('fitAll').onclick = fitAll;

viewport.addEventListener('wheel', e => {
  if (isH() && Math.abs(e.deltaX) > Math.abs(e.deltaY) && !e.ctrlKey) return;   // горизонтальный свайп — обычная прокрутка
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
  setScale(scale * factor, ptrMain(e) - rectMain());
}, { passive: false });

// перетаскивание мышью — сдвиг по обеим осям
let drag = null, moved = false;
viewport.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, l: viewport.scrollLeft, t: viewport.scrollTop };
  moved = false;
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx, dy) > 5) { moved = true; viewport.classList.add('dragging'); }
  if (moved) { viewport.scrollLeft = drag.l - dx; viewport.scrollTop = drag.t - dy; }
});
window.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });
viewport.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);

// щипок пальцами
let pinch = null;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 2) pinch = { d: dist(e.touches), s: scale };
}, { passive: true });
viewport.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const c = isH() ? (e.touches[0].clientX + e.touches[1].clientX) / 2 : (e.touches[0].clientY + e.touches[1].clientY) / 2;
    setScale(pinch.s * dist(e.touches) / pinch.d, c - rectMain());
  }
}, { passive: false });
viewport.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });

// ---------- ориентация и вид ----------
function setOrient(o) {
  orient = o === 'v' ? 'v' : 'h';
  document.getElementById('orientH').classList.toggle('active', isH());
  document.getElementById('orientV').classList.toggle('active', !isH());
  try { localStorage.setItem('booksOrient', orient); } catch (e) {}
  if (!viewport.classList.contains('hidden')) fitAll();
}
document.getElementById('orientH').onclick = () => setOrient('h');
document.getElementById('orientV').onclick = () => setOrient('v');

function updateHeader() {
  document.documentElement.style.setProperty('--hh', document.getElementById('header').offsetHeight + 'px');
}
function setView(v) {
  const tl = v === 'timeline';
  document.body.classList.toggle('tl', tl);
  viewport.classList.toggle('hidden', !tl);
  document.getElementById('listWrap').classList.toggle('hidden', tl);
  document.getElementById('viewTimeline').classList.toggle('active', tl);
  document.getElementById('viewList').classList.toggle('active', !tl);
  ['zoomIn', 'zoomOut', 'fitAll', 'hint', 'orientH', 'orientV'].forEach(id => document.getElementById(id).classList.toggle('hidden', !tl));
  try { localStorage.setItem('booksView', v); } catch (e) {}
  updateHeader();
  if (tl) fitAll();
}
document.getElementById('viewTimeline').onclick = () => setView('timeline');
document.getElementById('viewList').onclick = () => setView('list');

// ---------- старт ----------
function renderList() {
  const list = document.getElementById('bookList');
  list.innerHTML = '';
  books.filter(b => b._d).sort((a, b) => a._d.value - b._d.value).forEach(b => list.appendChild(listCard(b)));
  books.filter(b => !b._d).forEach(b => list.appendChild(listCard(b)));
}
function render() { prepare(); renderList(); computeRange(); renderTimeline(); }

prepare();
renderList();
let savedView = 'timeline';
try {
  savedView = localStorage.getItem('booksView') || 'timeline';
  orient = localStorage.getItem('booksOrient') === 'v' ? 'v' : 'h';
} catch (e) {}
document.getElementById('orientH').classList.toggle('active', isH());
document.getElementById('orientV').classList.toggle('active', !isH());
setView(savedView === 'list' ? 'list' : 'timeline');

let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { updateHeader(); if (!viewport.classList.contains('hidden')) fitAll(); }, 150);
});
</script>
